<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#d90000"><title>RideLog</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f4f4f4;font-family:system-ui,-apple-system,sans-serif}.header{height:210px;background:#d90000;padding:26px 22px}.brand{font-size:30px;font-weight:700}.sub{font-size:14px;opacity:.85;margin-top:4px}.topline{display:flex;justify-content:space-between;margin-top:28px}.badge{border:1px solid #ffffff75;border-radius:24px;padding:8px 12px;font-size:13px}.profile{margin:-42px 16px 0;background:#1f1f20;border-radius:23px;padding:23px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pname{font-size:22px;font-weight:700}.muted{color:#aaa;font-size:14px;margin-top:5px}.info{border-top:1px solid #383838;margin-top:14px;padding-top:12px;font-size:14px;color:#c5c5c5}.content{padding:18px 16px 115px}.timerCard,.stationCard,.historyCard{background:#171719;border:1px solid #323234;border-radius:22px;padding:20px;margin-bottom:14px}.label{color:#aaa;text-transform:uppercase;letter-spacing:1.2px;font-size:12px}.clock{font-size:42px;font-weight:700;margin:8px 0}.stationName{font-weight:650;font-size:18px}.btn{background:transparent;border:1px solid #777;color:#eee;border-radius:25px;padding:10px 14px}.slider{position:relative;background:#111;height:94px;border:2px solid #343436;border-radius:55px;margin-top:18px;overflow:hidden;touch-action:none}.knob{position:absolute;left:2px;top:2px;width:86px;height:86px;border-radius:50%;background:#e00000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;touch-action:none}.hint{position:absolute;right:16px;top:27px;text-align:center;color:#888;font-size:13px;max-width:140px}.wide{width:100%;border:1px solid #555;border-radius:14px;background:#262627;color:#eee;padding:13px;margin-top:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#202021;display:flex;justify-content:space-around;padding:10px 6px 20px;border-top:1px solid #353536}.tab{border:0;background:transparent;color:#ddd;border-radius:17px;padding:10px 8px;font-size:12px;min-width:68px}.tab.active{background:#eee;color:#111}.tab span{display:block;font-size:22px;margin-bottom:4px}.overlay{display:none;position:fixed;inset:0;background:#000b;padding:12px;z-index:5}.sheet{background:#1a1a1b;border-radius:22px;height:100%;padding:15px;display:flex;flex-direction:column}.sheetHead{font-size:20px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:12px}.close{font-size:26px;color:white;background:none;border:0}.search{background:#252526;border:1px solid #555;border-radius:12px;padding:13px;color:white;font-size:16px;margin-bottom:12px}.map{height:170px;flex-shrink:0;background:#252b2b;border-radius:16px;position:relative;margin-bottom:10px;overflow:hidden}.line{position:absolute;width:80%;height:3px;background:#aaa;top:52%;left:10%;transform:rotate(-20deg)}.line2{position:absolute;width:60%;height:3px;background:#e55;top:40%;left:22%;transform:rotate(35deg)}.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#d00;border:2px solid #fff}.mapcaption{position:absolute;bottom:9px;left:12px;color:#aaa;font-size:11px}.stationList,.histList{overflow:auto}.stationItem{padding:14px;border-bottom:1px solid #333}.trip{padding:13px;background:#29292a;border-radius:13px;margin:8px 0}.toast{display:none;position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#333;padding:12px 16px;border-radius:12px;z-index:8}
</style></head><body><header class="header"><div class="brand">RideLog</div><div class="sub">Dein persönlicher Fahrzeit-Tracker</div><div class="topline"><span class="badge">Private Zeitmessung</span><button class="badge" onclick="rename()">Profil bearbeiten</button></div></header><section class="profile"><div class="row"><div><div class="pname" id="profile">Mein Profil</div><div class="muted" id="stats">0 gespeicherte Fahrten</div></div><button class="btn" onclick="rename()">✎</button></div><div class="info">Nur Zeitmessung · keine Fahrkartenfunktion</div></section><main class="content"><section class="timerCard"><div class="label">Fahrtzeit</div><div class="clock" id="clock">00:00:00</div><div class="muted" id="state">Bereit</div></section><section class="stationCard"><div class="row"><div><div class="muted">Startstation</div><div class="stationName" id="station">Seon</div></div><button class="btn" onclick="pick()">Station ändern</button></div><div class="slider" id="track"><div class="knob" id="knob">Start</div><div class="hint" id="hint">Zum Start nach rechts ziehen</div></div><button class="wide" id="stop" onclick="finish()" style="display:none">Fahrt beenden und speichern</button></section><button class="wide" onclick="historyOpen()">Fahrtenverlauf anzeigen</button></main><nav class="bottom"><button class="tab" onclick="historyOpen()"><span>◷</span>Verlauf</button><button class="tab active" onclick="timerHome()"><span>⏱</span>Timer</button><button class="tab" onclick="pick()"><span>⌖</span>Station</button><button class="tab" onclick="rename()"><span>⚙</span>Profil</button></nav>
<div class="overlay" id="pick"><div class="sheet"><div class="sheetHead">Startstation wählen<button class="close" onclick="closePick()">×</button></div><input class="search" id="q" placeholder="Station suchen" oninput="stationRender()"><div class="map"><div class="line"></div><div class="line2"></div><i class="dot" style="left:14%;top:59%"></i><i class="dot" style="left:31%;top:46%"></i><i class="dot" style="left:53%;top:54%"></i><i class="dot" style="left:72%;top:31%"></i><i class="dot" style="left:85%;top:27%"></i><div class="mapcaption">Schematische Stationenübersicht</div></div><div class="stationList" id="stationList"></div></div></div><div class="overlay" id="history"><div class="sheet"><div class="sheetHead">Fahrtenverlauf<button class="close" onclick="historyClose()">×</button></div><div class="histList" id="histList"></div><button class="wide" onclick="clearHistory()">Verlauf löschen</button></div></div><div class="toast" id="toast"></div>
<script>
const S=['Seon','Seon, Birren Nord','Lenzburg','Aarau','Zürich HB','Luzern','Bern','Basel SBB','Winterthur','Olten','Baden','Brugg','Hallwil','Boniswil','Hitzkirch','Sursee','Zofingen','Wohlen AG','Muri AG','Rupperswil','Hendschiken','Schöftland'];let station=localStorage.station||'Seon',name=localStorage.profile||'Mein Profil',started=+(localStorage.active||0),tick;const $=id=>document.getElementById(id);$('profile').textContent=name;$('station').textContent=station;
function fmt(ms){let t=Math.floor(ms/1000);return [Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(v=>('0'+v).slice(-2)).join(':')}function run(){if(!started)return;$('state').textContent='Timer läuft · '+station;$('hint').style.display='none';$('knob').textContent='Stop';$('stop').style.display='block';tick=setInterval(()=>$('clock').textContent=fmt(Date.now()-started),1000);$('clock').textContent=fmt(Date.now()-started)}function begin(){if(started)return;started=Date.now();localStorage.active=started;run()}
function finish(){if(!started)return;clearInterval(tick);let H=JSON.parse(localStorage.history||'[]');H.unshift({station,time:new Date(started).toLocaleString('de-CH'),duration:Date.now()-started});localStorage.history=JSON.stringify(H);started=0;localStorage.removeItem('active');$('clock').textContent='00:00:00';$('state').textContent='Fahrt gespeichert';$('knob').textContent='Start';$('knob').style.left='2px';$('hint').style.display='block';$('stop').style.display='none';stats();toast('Fahrt gespeichert')}
function stats(){let H=JSON.parse(localStorage.history||'[]');$('stats').textContent=H.length+' gespeicherte Fahrten'}function rename(){let n=prompt('Profilname',name);if(n&&n.trim()){name=n.trim();localStorage.profile=name;$('profile').textContent=name}}function pick(){ $('pick').style.display='block';$('q').value='';stationRender()}function closePick(){$('pick').style.display='none'}function stationRender(){let q=$('q').value.toLowerCase();$('stationList').innerHTML=S.filter(x=>x.toLowerCase().includes(q)).map(x=>`<div class="stationItem" onclick="selectStation('${x.replaceAll("'","\\'")}')">${x}</div>`).join('')||'<div class="muted">Keine Station gefunden</div>'}function selectStation(s){station=s;localStorage.station=s;$('station').textContent=s;closePick();if(started)$('state').textContent='Timer läuft · '+s}
function historyOpen(){ $('history').style.display='block';let H=JSON.parse(localStorage.history||'[]');$('histList').innerHTML=H.map(x=>`<div class="trip"><b>${x.station}</b><div class="muted">${x.time}</div><div>Dauer ${fmt(x.duration)}</div></div>`).join('')||'<p class="muted">Noch keine Fahrten</p>'}function historyClose(){$('history').style.display='none'}function clearHistory(){if(confirm('Fahrtenverlauf löschen?')){localStorage.removeItem('history');historyOpen();stats()}}function timerHome(){historyClose();closePick()}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1700)}let drag=false;function down(e){if(started){finish();return}drag=true;e.preventDefault()}function move(e){if(!drag)return;let r=$('track').getBoundingClientRect(),max=r.width-$('knob').offsetWidth-4,x=Math.max(0,Math.min(max,e.clientX-r.left-40));$('knob').style.left=x+'px';if(x>max*.78){drag=false;$('knob').style.left='2px';begin()}}function up(){drag=false;if(!started)$('knob').style.left='2px'}$('knob').addEventListener('pointerdown',down);$('knob').addEventListener('pointermove',move);$('knob').addEventListener('pointerup',up);$('knob').addEventListener('pointercancel',up);stats();if(started)run();
</script></body></html>
